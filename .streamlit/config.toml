[theme]
base = "light"
# 귤색: 주 버튼·선택 강조(버튼 글자는 진한 색으로 CSS에서 바꿔 대비 4.5:1 이상)
primaryColor = "#F0892B"
# 감귤잎 초록: 링크
linkColor = "#1E5636"
# 현무암 느낌의 옅은 돌색 바탕
backgroundColor = "#F5F5F1"
secondaryBackgroundColor = "#E8E9E5"
textColor = "#1D2124"
borderColor = "#D7D9D3"
# 어르신 사용자를 고려해 기본 글자를 조금 크게
baseFontSize = 17
baseRadius = "large"
buttonRadius = "large"
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
